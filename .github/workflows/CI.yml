name: update-friends-posts
on:
  push:
    branches: ["dev", "main"]
    tags:
      - "v*.*.*"
  schedule:
    # 每天 02:05（Asia/Shanghai，UTC+8）执行；GitHub Actions 的 cron 使用 UTC
    - cron: "5 18 * * *"
  workflow_dispatch:

# 串行执行，避免定时任务与手动/推送触发的任务同时提交 data.json 导致推送冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 在这里查看需要添加的 secret
  PROXY: ${{ secrets.PROXY }} # 可选，http代理
  # gemini：https://ai.google.dev/gemini-api/docs/api-key?hl=zh-cn
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # siliconflow：https://cloud.siliconflow.cn/me/account/ak
  SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
  # bigmodel：https://bigmodel.cn/usercenter/proj-mgmt/apikeys
  BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
  # 时区配置
  TZ: Asia/Shanghai

jobs:
  check:
    if: ${{ (github.ref != 'refs/heads/main') || ( github.repository == 'Rock-Candy-Tea/hexo-circle-of-friends' && github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: rustfmt
        run: cargo fmt --all --check

  test:
    if: ${{ (github.ref != 'refs/heads/main') || ( github.repository == 'Rock-Candy-Tea/hexo-circle-of-friends' && github.ref_type == 'tag') }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-features --all-targets -- --test-threads=1

  build-and-release:
    if: ${{ github.ref_type == 'tag' }}
    needs: [check, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-unknown-linux-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-unknown-linux-musl
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - name: win-x86_64-pc-windows-gnu
            runner: windows-latest
            target: x86_64-pc-windows-gnu
          - name: win-x86_64-pc-windows-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64-apple-darwin
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64-apple-darwin
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release"

      - name: Package binaries (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          mkdir -p dist
          zip -j dist/${{ matrix.name }}.zip target/${{ matrix.target }}/release/fcircle_core

      - name: Package binaries (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          mkdir dist
          Compress-Archive -Path "target\${{ matrix.target }}\release\fcircle_core.exe" -DestinationPath "dist\${{ matrix.name }}.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-fcircle
          path: dist/${{ matrix.name }}.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/${{ matrix.name }}.zip

  build-and-run-core:
    if: ${{ github.ref_type != 'tag' && github.repository != 'Rock-Candy-Tea/hexo-circle-of-friends' }}
    name: build and run core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin fcircle_core
      - name: Run Core
        run: cargo run --bin fcircle_core --release
      - name: Push data.json
        uses: EndBug/add-and-commit@v9
        with:
          add: "data.json --force"
          message: "Update data.json"
          default_author: github_actions
          pull: "--rebase --autostash"
      - name: Copy data.json for Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: cp data.json cloudflare/public/data.json
      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy

  keepalive-workflow:
    name: Keepalive Workflow
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
